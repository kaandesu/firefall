# FIREFALL in one compose: the website, a Lagrange server, and its Postgres.
#
# Coolify: Build Pack = Docker Compose, then set the domains on the services:
#   web       https://firefall.space
#   lagrange  https://lagrange.firefall.space:8080   (":8080" is the container port, not a public one)
# and the env vars from .env.example (LAGRANGE_PUBLIC_URL=https://lagrange.firefall.space, LAGRANGE_TRUST_PROXY=1).
#
# No ports are published here: Coolify's proxy reaches the containers over the Docker network.
# On a laptop, add the local file to get localhost ports (web on 3000, Lagrange on 8080):
#   cp .env.example .env
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# Behind a reverse proxy, WebSockets (/tunnel) and server-sent events (/api/events) must pass unbuffered.
# No Docker? scripts/lagrange-local.sh runs Lagrange with a local Postgres.
services:
  web:
    # The FIREFALL website (static, nginx). Build context is the repo root.
    build: .
    image: firefall-web:latest
    restart: unless-stopped
    expose:
      - "80"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lagrange
      POSTGRES_USER: lagrange
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - lagrange-pg:/var/lib/postgresql/data   # agents, tasks and accounts survive restarts and rebuilds
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lagrange -d lagrange"]
      interval: 5s
      timeout: 3s
      retries: 20

  lagrange:
    # Built from the public repository: there is no published image to pull yet.
    build: https://github.com/three-agent-problem/lagrange.git#main
    image: firefall-lagrange:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      DATABASE_URL: postgres://lagrange:${POSTGRES_PASSWORD}@postgres:5432/lagrange?sslmode=disable
      LAGRANGE_PUBLIC_URL: ${LAGRANGE_PUBLIC_URL:-http://localhost:8080}
      LAGRANGE_ADMIN_EMAIL: ${LAGRANGE_ADMIN_EMAIL:?set LAGRANGE_ADMIN_EMAIL in .env}
      LAGRANGE_ADMIN_PASSWORD: ${LAGRANGE_ADMIN_PASSWORD:?set LAGRANGE_ADMIN_PASSWORD in .env}
      LAGRANGE_ADMIN_NAME: ${LAGRANGE_ADMIN_NAME:-You}
      LAGRANGE_ADMIN_HANDLE: ${LAGRANGE_ADMIN_HANDLE:-you}
      LAGRANGE_SIGNUP: ${LAGRANGE_SIGNUP:-invite}
      LAGRANGE_TRUST_PROXY: ${LAGRANGE_TRUST_PROXY:-0}

volumes:
  lagrange-pg:
