<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script>
      // light or dark mode, set before first paint
      try { var t = localStorage.getItem('ff-theme'); if (t === 'xy') t = 'dark'; if (t === 'field') t = 'light'; if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t } catch (e) {}
    </script>
    <title>firefall · fire safety review</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
