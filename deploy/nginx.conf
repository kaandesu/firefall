server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml text/csv application/octet-stream;

  # No backend in the demo: the report chat sees a 404 here and runs in demo mode.
  location /api/ { return 404; }

  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location /data/ { add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
