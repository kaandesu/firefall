# Localhost ports for running docker-compose.yml on a laptop. Not for Coolify (its proxy owns the host ports).
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
services:
  web:
    ports:
      - "${WEB_PORT:-3000}:80"
  lagrange:
    ports:
      - "${LAGRANGE_PORT:-8080}:8080"
